name: Build desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Archive the bundle directory
        shell: bash
        env:
          ARCHIVE_NAME: desktop-${{ matrix.os }}.tar.gz
        run: |
          bundle="src-tauri/target/release/bundle"
          test -d "$bundle"
          test -n "$(find "$bundle" -type f -print -quit)"
          tar -czf "$ARCHIVE_NAME" -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop-${{ matrix.os }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Attach bundle archives to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" bundles/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" bundles/*.tar.gz --draft --verify-tag --generate-notes
          fi
