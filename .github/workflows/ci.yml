name: CI

# From Dev/_templates/workflows/ci-node.yml, on pnpm. Pull requests and
# pushes to main only; docs-only changes skip it.
on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node bin/nexis-design.mjs theme new ci-demo --hue 258 --out "$RUNNER_TEMP/ci-demo.ts"

  scaffold:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Scaffold a deep settings app
        run: NEXIS_PATH="$PWD" bash scripts/new-app.sh nexis-ci settings-deep "$PWD/.scaffold"
      - name: Build the generated app
        working-directory: .scaffold
        run: |
          pnpm install
          pnpm build
          cargo check --manifest-path src-tauri/Cargo.toml
      - if: runner.os == 'Linux'
        run: pnpm bundle:check .scaffold

  browser:
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm a11y
      - run: pnpm visual:check
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression
          path: dist/visual/
          if-no-files-found: ignore
